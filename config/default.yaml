# ============================================================================
# Climate Capacitor — default configuration
# Every tunable knob lives here so experiments are reproducible and the
# topography->permittivity parameterization can be swapped without code edits.
# ----------------------------------------------------------------------------
# HOW TO EXPERIMENT:  find the lines marked   <<<<< PLAY: [options] >>>>>
#   1) change ONE value to one of the options in the [ ] brackets
#   2) save this file
#   3) re-run a script (e.g. scripts/run_all.py) and compare the results
# ============================================================================

# --- Spatial / temporal domain -------------------------------------------
domain:
  # Geographic bounds. Full globe by default; narrow to a region for fast dev.
  lat_min: -90.0
  lat_max:  90.0
  lon_min: -180.0
  lon_max:  180.0
  # Grid resolution. IMPORTANT: if you change this you must ALSO swap cloud_uri
  # (below) to the matching store. Detail vs RAM:
  #   1.5   (240x121) ~150 km · ~2 GB RAM · laptop-safe (default)
  #   1.0   (360x181) ~110 km · ~3 GB RAM · finer, still moderate
  #   0.703 (512x256) ~78 km  · ~5-7 GB RAM · heavy (needs >=32 GB; BSOD'd a 16 GB PC)
  resolution_deg: 1.5           # <<<<< PLAY: [1.5, 1.0, 0.703]  (also swap cloud_uri!) >>>>>
  # Exclude very high latitudes (poles have ~no disasters, noisy gradients).
  analysis_lat_max: 66.0

time:
  start: "2010-01-01"
  end:   "2019-12-31"
  train_fraction: 0.65          # ~6.5 yr train, ~3.5 yr validate (time-split)

# --- Data sources ---------------------------------------------------------
data:
  era5:
    source: "cloud"
    variable: "2m_temperature"
    # Pick the ONE cloud_uri that matches resolution_deg above (uncomment one):
    cloud_uri: "gs://weatherbench2/datasets/era5/1959-2022-6h-240x121_equiangular_with_poles_conservative.zarr"   # 1.5 deg
    # cloud_uri: "gs://weatherbench2/datasets/era5/1959-2022-6h-360x181_equiangular_with_poles_conservative.zarr" # 1.0 deg
    # cloud_uri: "gs://weatherbench2/datasets/era5/1959-2022-6h-512x256_equiangular_conservative.zarr"            # 0.703 deg
    daily_statistic: "mean"     # <<<<< PLAY: [mean, max, min] >>>>>  (max = hottest moment, best in our sweep)
    cache_dir: "data/cache"     # local cache of the downloaded data
  topography:
    source: "weatherbench2"     # terrain comes from the same store (no extra download)
    etopo_path: "data/raw/etopo.nc"
  disasters:
    source: "gdis"              # <<<<< PLAY: [gdis, emdat] >>>>>  (gdis = precise coords; emdat = country-level)
    types: "full"               # <<<<< PLAY: [full, thermal, temperature] >>>>>  which disasters to score against
    #   full = all weather (flood/storm/drought/wildfire/heat-cold) · thermal = heat-driven only
    #   temperature = heat/cold waves only.  (Earthquakes/volcanoes are always excluded.)
    emdat_path: "data/raw/public_emdat_custom_request_2026-06-04_60fb1c7a-4eac-4831-b601-8ac763ee07d9.xlsx"
    gdis_path: "data/raw/pend-gdis-1960-2018-disasterlocations.csv"
    path: "data/raw/public_emdat_custom_request_2026-06-04_60fb1c7a-4eac-4831-b601-8ac763ee07d9.xlsx"  # (used by emdat-only mode)

# --- Physics: thermal charge (how heat builds up over time) --------------
charge:
  window_days: 30               # <<<<< PLAY: [15, 30, 60, 90] >>>>>  (days of heat build-up)
  decay_per_day: 0.02           # <<<<< PLAY: [0.0, 0.02, 0.05, 0.1] >>>>>  (how fast old heat leaks away)
  climatology_smooth_days: 15   # smoothing of the day-of-year "normal"

# --- Physics: permittivity (terrain -> resistance epsilon) ---------------
permittivity:
  method: "linear"              # <<<<< PLAY: [linear, log, slope, combined] >>>>>  (terrain formula)
  eps_min: 0.5                  # <<<<< PLAY: [0.2, 0.4, 0.5, 0.6, 0.7] >>>>>  (how much terrain matters)
  eps_max: 1.0                  # smooth terrain / ocean (leave at 1.0)
  params:
    elevation_ref_m: 4000.0     # elevation where eps reaches eps_min
    slope_weight: 0.5           # slope vs elevation weight (only for "combined")

# --- Physics: breakdown field (the "stress" map) -------------------------
breakdown:
  threshold_mode: "percentile"  # percentile | absolute
  threshold_value: 97.5         # <<<<< PLAY: [90, 95, 97.5, 99] >>>>>  (lower = flag MORE risk zones)

# --- Detection / clustering ----------------------------------------------
clustering:
  algorithm: "components"       # <<<<< PLAY: [components, dbscan] >>>>>  (components = fast)
  dbscan_eps_cells: 2.0         # neighborhood radius in grid cells
  dbscan_min_samples: 5         # min flagged cells to form a blob
  link_radius_km: 300.0         # link day-to-day blobs within this distance into one event

# --- Validation against the disaster records -----------------------------
validation:
  spatial_radius_km: 100.0      # <<<<< PLAY: [100, 250, 500] >>>>>  (how close counts as a "hit")
  temporal_window_hours: 48     # <<<<< PLAY: [48, 168, 360, 720] >>>>>  (hours; 48h..30d early-warning window)
  success:                      # the project's target thresholds (for reference; don't need to change)
    min_recall: 0.30
    min_precision: 0.10
    max_pvalue: 0.05

# --- Misc -----------------------------------------------------------------
run:
  seed: 42
  output_dir: "outputs"
  log_level: "INFO"
